<style>

.typed{font-size:14px;color:var(--mu);font-weight:500}

@keyframes fl3{to{transform:translate(40px,-60px) scale(1.2)}}

.obc>*{animation:up .6s both}.obc>:nth-child(2){animation-delay:.12s}.obc>:nth-child(3){animation-delay:.24s}

<script>
const D=864e5,IV=[6e4,3e5,72e5,D,3*D],RL=['Sehr schwer','Schwer','Mittel','Leicht','Sehr leicht'],RT=['1 Min','5 Min','2 Std','1 Tag','3 Tage'],RC=['#ff5d73','#ff9a5d','#ffd35d','#6fe3a1','#5ad7ff'],COL=['#7c6cff','#2de2c5','#ff6b9a','#ffb454','#5ab0ff','#b8f35a'],CN=['Violett','Türkis','Rosa','Bernstein','Blau','Limette'];const TH={dark:{f:'',t:'#38e1ff'},light:{f:'',t:'#0a9fc0'},rose:{f:'#d4917f',t:'#a8677a'}};let DEF='#7c6cff',ob={i:0,name:'',ac:'#7c6cff',sub:'',goal:20,rem:'19:00',remOn:1,mode:'flip'};

if(!S||!S.disc){const d=uid(),f=uid();S={disc:[{id:d,name:'Biologie',color:COL[1],folders:[{id:f,name:'Zellbiologie'}]}],cards:[['Was ist das „Kraftwerk“ der Zelle?','Mitochondrium'],['Wo findet die Proteinsynthese statt?','An den Ribosomen'],['Welches Organell enthält die DNA?','Zellkern']].map(([q,a])=>({id:uid(),d,f,q,a,due:0,last:0,n:0,ok:0})),log:[],set:{vib:1,remOn:1,rem:'19:00',goal:20,mode:'flip'},remDay:''}}}
const save=()=>{try{localStorage.setItem('alphacards',JSON.stringify(S))}catch(x){}};
const vib=p=>{if(S.set.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(x){}};
const cardsOf=sc=>S.cards.filter(c=>sc==='all'||(sc.startsWith('f:')?c.f===sc.slice(2):c.d===sc));
const dueList=(sc,now=Date.now())=>cardsOf(sc).filter(c=>c.due<=now||(sc==='all'&&c.last&&now-c.last>=7*D));
const folder=id=>{for(const d of S.disc){const f=d.folders.find(x=>x.id===id);if(f)return f}};
const scName=sc=>sc==='all'?'Allgemein':sc.startsWith('f:')?'Training: '+(folder(sc.slice(2))?.name||''):disc(sc)?.name||'';
const todayN=()=>S.log.filter(l=>day(l.t)===day(Date.now())).length;
function streak(){const ds=new Set(S.log.map(l=>day(l.t)));let n=0,t=Date.now();if(!ds.has(day(t)))t-=D;while(ds.has(day(t))){n++;t-=D}return n}
const disc=id=>S.disc.find(d=>d.id===id);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function modal(t,fs,ok,del){const m=document.createElement('div');m.className='modal';
m.innerHTML=`<form class=sheet><h3>${t}</h3>${fs.map(f=>`<label>${f.l}${f.t==='sel'?`<select name=${f.k}>${f.o.map(o=>`<option value="${e(o[0])}" ${o[0]==f.v?'selected':''}>${e(o[1])}</option>`).join('')}</select>`:f.t==='ta'?`<textarea name=${f.k} rows=${f.r||3}>${e(f.v)}</textarea>`:`<input name=${f.k} type="${f.t||'text'}" value="${e(f.v)}">`}</label>`).join('')}<div class=acts>${del?'<button type=button class="btn dng" id=md>Löschen</button>':''}<button type=button class=btn id=mx>Abbrechen</button><button class="btn pri">${modal.lb||'Speichern'}</button></div></form>`;
document.body.append(m);modal.lb=0;const c=()=>m.remove();m.onclick=ev=>{if(ev.target===m)c()};m.querySelector('#mx').onclick=c;
if(del)m.querySelector('#md').onclick=()=>ask('Wirklich löschen?',()=>{del();c();save();render()});
m.querySelector('form').onsubmit=ev=>{ev.preventDefault();const v=Object.fromEntries(new FormData(ev.target));c();ok(v);save();render()}}
/* Lernen */
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
const lev=(a,b)=>{const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]};
function check(u,a){const x=norm(u),y=norm(a);if(x===y)return'ok';return x&&lev(x,y)<=Math.max(1,Math.floor(y.length*.15))?'near':'no'}
function start(sc,all){const l=(all?cardsOf(sc):dueList(sc)).sort(all?(a,b)=>(a.n?a.ok/a.n:0)-(b.n?b.ok/b.n:0):(a,b)=>a.due-b.due);if(!l.length)return toast('Nichts fällig – stark!');ses={sc,q:l.map(c=>c.id),done:0,ok:0,stage:'q',res:null,tot:l.length};tab='study';vib(15);render()}
function reveal(){const c=S.cards.find(x=>x.id===ses.q[0]);if(S.set.mode==='type'){ses.typed=$('#ans').value;ses.res=check(ses.typed,c.a);vib(ses.res==='no'?[40,30,40]:12)}else vib(10);ses.stage='a';render()}
function rate(r){const c=S.cards.find(x=>x.id===ses.q[0]),n=Date.now();vib(r<2?[30,40,30]:r<4?14:[10,30,10]);c.n++;if(r>=2){c.ok++;ses.ok++}c.last=n;c.due=n+IV[r];S.log.push({t:n,r,d:c.d});ses.q.shift();if(IV[r]<=3e5)ses.q.push(c.id);else ses.done++;ses.stage='q';ses.res=null;save();if(!ses.q.length)vib([20,50,20,50,80]);render()}
const exit=()=>{ses=null;tab='home';render()};
/* Ansichten */
function home(){const all=dueList('all').length,td=todayN(),g=+S.set.goal||20;
return `<header><div><h1>Hallo, ${e(S.set.name)}</h1><span class=mini>Alpha Cards</span></div><span class=chip>${streak()} Tage in Serie</span></header>
<section class=hero><div class=big>${all}</div><div class=sub>Karten fällig · Allgemein</div><div class=bar><i style="width:${Math.min(100,td/g*100)}%"></i></div><div class=mini>${td} von ${g} heute</div><button class="btn pri" onclick="start('all')" ${all?'':'disabled'}>Allgemein lernen</button></section>
<div class=modes>${[['flip','Karteikarte','Umdrehen und selbst einschätzen'],['type','Antwort tippen','Schreiben, die App prüft']].map(([k,l,d])=>`<button class="mt ${k} ${S.set.mode===k?'on':''}" onclick="S.set.mode='${k}';vib(12);save();render()"><i class=pv>${k==='flip'?'?':'› _'}</i>${l}<small>${d}</small></button>`).join('')}</div>
${exams()}<h2>Disziplinen</h2>${S.disc.map(d=>{const n=dueList(d.id).length;return `<div class=row style="--ac:${d.color}" onclick="start('${d.id}')"><b class=dot></b><span>${e(d.name)}</span><em>${n?n+' fällig':'erledigt'}</em></div>`}).join('')||'<p class=mut>Lege unter „Karten“ deine erste Disziplin an.</p>'}`}
function study(){if(!ses.q.length){return `<div class=top><h1>Runde geschafft</h1></div><section class=hero><div class=big>${ses.done}</div><div class=sub>Karten gelernt · ${ses.ok} Mal gewusst</div><button class="btn pri" onclick="exit()">Zurück</button></section>`}
const c=S.cards.find(x=>x.id===ses.q[0]),ty=S.set.mode==='type',a=ses.stage==='a',sg=ses.res==='ok'?3:ses.res==='near'?2:ses.res==='no'?0:-1,vt={ok:'Richtig',near:'Fast richtig',no:'Nicht ganz'};
return `<div class="m-${S.set.mode}"><div class=top><button class="btn sm" onclick="exit()">✕</button><h1>${e(scName(ses.sc))}</h1><span class=mini>${ses.q.length} offen</span></div><div class=mbadge>${ty?'Antwort tippen':'Karteikarte'}</div>
<div class=bar><i style="width:${ses.done/(ses.done+ses.q.length)*100}%"></i></div>
<div class="card ${a?'fl':''}" ${!a&&!ty?'onclick="reveal()"':''} style="margin-top:14px"><div>${e(c.q)}</div>${!a&&!ty?'<div class=hint>Tippe, um umzudrehen</div>':''}${a?`<hr><div class=ans>${e(c.a)}</div>${ses.res?`<div class="v ${ses.res}">${vt[ses.res]}</div><div class=typed>Du: ${e(ses.typed||'–')}</div>`:''}`:''}</div>
${a?`<div class=rt>${RL.map((l,i)=>`<button style="--c:${RC[i]}" class="${i===sg?'sug':''}" onclick="rate(${i})">${l}<small>${RT[i]}</small></button>`).join('')}</div>`
:ty?`<div class=ctl><input id=ans placeholder="Deine Antwort" autocomplete=off onkeydown="if(event.key==='Enter')reveal()"><button class="btn pri" onclick="reveal()">Prüfen</button></div>`
:`<div class=ctl><button class="btn pri" onclick="reveal()">Antwort zeigen</button></div>`}</div>`}
function lib(){
if(!nv.d)return `<header><h1>Karten</h1><span><button class="btn sm" onclick="impDeck()">Deck importieren</button> <button class="btn sm pri" onclick="addDisc()">+ Disziplin</button></span></header>${S.disc.map(d=>`<div class=row style="--ac:${d.color}" onclick="nv={d:'${d.id}'};render()"><b class=dot></b><span>${e(d.name)}</span><em>${S.cards.filter(c=>c.d===d.id).length} Karten</em></div>`).join('')||'<p class=mut>Noch keine Disziplin. Lege z. B. „Biologie“ an.</p>'}`;
const d=disc(nv.d);
if(!nv.f)return `<div class=top><button class="btn sm" onclick="nv={};render()">‹</button><h1>${e(d.name)}</h1><button class="btn sm" onclick="editDisc()">Ändern</button></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm pri" onclick="addFolder()">+ Ordner</button><button class="btn sm dng" onclick="delDisc()">Disziplin löschen</button></div><h2>Ordner</h2>${d.folders.map(f=>`<div class=row onclick="nv.f='${f.id}';render()"><b class=dot></b><span>${e(f.name)}</span><em>${f.exam?'Prüfung '+new Date(f.exam).toLocaleDateString('de',{day:'numeric',month:'short'})+' · ':''}${S.cards.filter(c=>c.f===f.id).length} Karten</em></div>`).join('')||'<p class=mut>Lege einen Unterordner an, z. B. „Kapitel 1“.</p>'}`;

return `<div class=top><button class="btn sm" onclick="nv={d:nv.d};render()">‹</button><h1>${e(f.name)}</h1><button class="btn sm" onclick="editFolder()">Ändern</button></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm pri" onclick="cardForm()">+ Karte</button><button class="btn sm" onclick="bulk()">Viele / mit KI</button><button class="btn sm" onclick="start('f:'+nv.f,1)">Prüfungstraining</button><button class="btn sm dng" onclick="delFolder()">Ordner löschen</button></div><div class=shr><div><b>Deck teilen</b><small>Per Link oder Code an Freunde senden</small><div class=shr-b><button onclick="shareDeck('link')"><svg width=20 height=20 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Link</button><button onclick="shareDeck('code')"><svg width=20 height=20 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg>Code</button></div></div></div><h2>${cs.length} Karten</h2>${cs.map(c=>`<div class=row onclick="cardForm('${c.id}')"><span>${e(c.q)}<br><small class=mut>${e(c.a)}</small></span></div>`).join('')||'<p class=mut>Noch leer. Tippe auf „+ Karte“ oder importiere viele auf einmal.</p>'}`}
function stats(){const n=Date.now(),days=[...Array(7)].map((_,i)=>n-(6-i)*D),cnt=days.map(t=>S.log.filter(l=>day(l.t)===day(t)).length),mx=Math.max(1,...cnt),wk=S.log.filter(l=>l.t>n-7*D),acc=wk.length?Math.round(100*wk.filter(l=>l.r>=2).length/wk.length):0,m=S.cards.filter(c=>c.due-c.last>=D).length;
return `<header><h1>Erfolg</h1></header><div class=ring style="--p:${acc}"><div><b>${acc}%</b><span class=mut>gewusst · 7 Tage</span></div></div><div class=stat><b>Diese Woche</b><span class=mut>Abfragen pro Tag</span><div class=bars>${cnt.map((v,i)=>`<div>${v}<i class="${i==6?'today':''}" style="height:${v/mx*100}%;animation-delay:${i*70}ms"></i>${new Date(days[i]).toLocaleDateString('de',{weekday:'short'})}</div>`).join('')}</div></div>
<div class=grid><div class=stat><b>${wk.length}</b><span class=mut>Abfragen (7 Tage)</span></div><div class=stat><b>${S.log.filter(l=>day(l.t)===day(n)).length}</b><span class=mut>heute</span></div><div class=stat><b>${streak()}</b><span class=mut>Tage in Serie</span></div><div class=stat><b>${m}/${S.cards.length}</b><span class=mut>gefestigt (≥ 1 Tag)</span></div></div>
<h2>Disziplinen</h2>${S.disc.map(d=>{const t=S.cards.filter(c=>c.d===d.id),g=t.filter(c=>c.due-c.last>=D).length;return `<div class=row style="--ac:${d.color}"><b class=dot></b><span>${e(d.name)}</span><em>${g}/${t.length} gefestigt</em></div><div class=bar style="margin:-2px 6px 12px;--ac:${d.color}"><i class=gx style="width:${t.length?g/t.length*100:0}%"></i></div>`}).join('')}`}
function more(){const s=S.set;return `<header><h1>Mehr</h1></header><h2>Design</h2><div class=themes>${[['dark','Dunkel'],['light','Weiß'],['rose','Rosé Gold']].map(([k,l])=>`<button class="th ${k} ${(S.set.theme||'dark')===k?'on':''}" onclick="S.set.theme='${k}';vib(12);save();render()">${l}</button>`).join('')}</div>
<div class=tg>Haptisches Feedback<input type=checkbox ${s.vib?'checked':''} onchange="S.set.vib=this.checked?1:0;save();vib(30)"></div>
<div class=tg>Tägliche Erinnerung<input type=checkbox ${s.remOn?'checked':''} onchange="S.set.remOn=this.checked?1:0;save()"></div>
<div class=tg><span>Erinnerung ab<br><small class=mut>Ab dieser Uhrzeit erinnert dich die App einmal am Tag, falls du noch nicht gelernt hast.</small></span><input type=time value="${s.rem}" onchange="S.set.rem=this.value;save()"></div>

<div class=ctl><button class=btn onclick="window.Notification?Notification.requestPermission().then(p=>toast(p==='granted'?'Benachrichtigungen an':'Nicht erlaubt')):toast('Nicht unterstützt')">Benachrichtigungen erlauben</button><button class=btn onclick="backup()">Backup exportieren / importieren</button><button class=btn onclick="ob.i=0;ob.name=S.set.name;S.set.name='';render()">Intro erneut ansehen</button></div>`}
function render(){if(!S.set.name){document.documentElement.style.setProperty('--ac',ob.ac);let o=$('#orbs');if(!o){o=document.createElement('div');o.id='orbs';o.innerHTML='<i></i><i></i><i></i>';document.body.append(o)}o.style.setProperty('--i',ob.i);$('#app').innerHTML=onboard();$('#obn,#obs')?.focus();return}const ac=ses||tab==='home'?(S.set.mode==='type'?TH[thm()].t:fcol()):tab==='lib'&&nv.d?disc(nv.d)?.color:fcol();document.documentElement.dataset.t=thm();document.documentElement.style.setProperty('--fc',fcol());document.documentElement.style.setProperty('--tc',TH[thm()].t);document.documentElement.style.setProperty('--ac',ac||fcol());$('#orbs')?.remove();document.documentElement.dataset.m=ses?S.set.mode:'';
if(tab==='lib'&&nv.d&&!disc(nv.d))nv={};
$('#app').innerHTML=({home,lib,study,stats,more})[tab]()+(tab==='study'?'':`<nav><div>${[['home','Heute'],['lib','Karten'],['stats','Erfolg'],['more','Mehr']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';nv={};render()">${l}</button>`).join('')}</div></nav>`);
if(tab==='study'&&S.set.mode==='type'&&ses.stage==='q')$('#ans')?.focus()}

/* Exam Agent, Teilen, KI */
function exams(){const n=day(Date.now()),l=[];S.disc.forEach(d=>d.folders.forEach(f=>{if(f.exam&&f.exam>=n)l.push([f,d,Math.round((new Date(f.exam)-new Date(n))/D)])}));l.sort((a,b)=>a[2]-b[2]);return l.length?`<h2>Prüfungen</h2>${l.map(([f,d,k])=>`<div class=row style="--ac:${d.color}" onclick="start('f:${f.id}',1)"><b class=dot></b><span>${e(f.name)}<br><small class=mut>${e(d.name)} · tippen zum Üben</small></span><em>${k===0?'heute':k===1?'morgen':'in '+k+' Tagen'}</em></div>`).join('')}`:''}
function banner(msg,sc,all){const b=document.createElement('div');b.className='ban';b.innerHTML=`<b>Alpha Cards · Exam Agent</b><div style="display:block;margin:4px 0 0;color:var(--mu)">${e(msg)}</div><div><button class="btn sm" id=bl>Später</button><button class="btn sm pri" id=bg>Jetzt üben</button></div>`;document.body.append(b);b.querySelector('#bl').onclick=()=>b.remove();b.querySelector('#bg').onclick=()=>{b.remove();start(sc,all)};if(window.Notification&&Notification.permission==='granted')try{new Notification('Alpha Cards',{body:msg})}catch(x){}}
function examCheck(){const n=new Date(),t=day(n),tm=day(n.getTime()+D),[h,m]=S.set.rem.split(':');if(n.getHours()*60+n.getMinutes()<+h*60+ +m)return;for(const d of S.disc)for(const f of d.folders)if(f.exam&&f.exam===tm&&f.exr!==t){f.exr=t;save();banner(`Morgen ist deine Prüfung: ${f.name}. Noch eine Übungsrunde?`,'f:'+f.id,1);return 1}}
const delDisc=()=>{const d=disc(nv.d);ask('„'+d.name+'“ mit allen Karten löschen?',()=>{S.disc=S.disc.filter(x=>x!==d);S.cards=S.cards.filter(c=>c.d!==d.id);nv={};save();render()})};
const delFolder=()=>{const d=disc(nv.d),f=folder(nv.f);ask('„'+f.name+'“ mit allen Karten löschen?',()=>{d.folders=d.folders.filter(x=>x!==f);S.cards=S.cards.filter(c=>c.f!==f.id);nv={d:d.id};save();render()})};
const enc=o=>'AC1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function shareDeck(kind){const d=disc(nv.d),f=folder(nv.f),raw=enc({d:d.name,n:f.name,c:S.cards.filter(c=>c.f===f.id).map(c=>[c.q,c.a])}),code=kind==='link'?'alphacards://import?d='+encodeURIComponent(raw):raw;modal.lb='Kopieren & teilen';modal(kind==='link'?'Link teilen':'Code teilen',[{k:'c',l:kind==='link'?'Dieser Link öffnet Alpha Cards bei deinen Freunden und importiert das Deck.':'Schicke diesen Code an Freunde. Sie fügen ihn bei „Deck importieren“ ein.',t:'ta',r:5,v:code}],()=>{try{navigator.clipboard.writeText(code).catch(()=>{})}catch(x){}if(window.AC&&AC.share)AC.share(code);else if(navigator.share)navigator.share({title:'Alpha Cards: '+f.name,text:code}).catch(()=>{});toast(kind==='link'?'Link kopiert':'Code kopiert')})}
function impDeck(pre){modal.lb='Importieren';modal('Deck importieren',[{k:'c',l:'Code oder Link eines Freundes einfügen',t:'ta',r:5,v:pre||''}],v=>{try{const o=JSON.parse(decodeURIComponent(escape(atob((v.c.includes('d=')?decodeURIComponent(v.c.split('d=')[1]):v.c).trim().replace(/^AC1:/,'')))));let d=S.disc.find(x=>x.name===o.d);if(!d){d={id:uid(),name:o.d,color:COL[S.disc.length%COL.length],folders:[]};S.disc.push(d)}const f={id:uid(),name:o.n,exam:''};d.folders.push(f);o.c.forEach(([q,a])=>S.cards.push({id:uid(),d:d.id,f:f.id,q,a,due:0,last:0,n:0,ok:0}));toast(o.c.length+' Karten importiert')}catch(x){toast('Code ungültig')}})}
function aiBtns(many){const f=document.querySelector('.modal form'),q=f.querySelector(many?'[name=t]':'[name=q]'),a=many?q:f.querySelector('[name=a]'),r=document.createElement('div');r.className='ai';r.innerHTML=`<select><option value="">Antwort (Wissen)</option>${['Englisch','Französisch','Spanisch','Italienisch','Latein','Deutsch'].map(l=>`<option>Übersetzen: ${l}</option>`).join('')}</select><button type=button class="btn sm pri">✦ Mit KI schreiben</button>`;a.parentNode.after(r);
const sl=r.querySelector('select'),b=r.querySelector('button');b.onclick=async()=>{const L=many?q.value.split('\n').filter(x=>x.trim()&&!x.includes(';')):[q.value.trim()].filter(Boolean);if(!L.length)return toast('Erst Frage oder Begriff eintragen');
const how=sl.value?'Übersetze nach '+sl.value.split(': ')[1]+'.':'Gib eine kurze, korrekte Karteikarten-Antwort (max. 2 Sätze).';b.disabled=1;b.textContent='…';
try{const s=await window.claude.use('sample');if(!s)throw 0;const o=await s.json(how+' Eingaben (je Eintrag eine Antwort): '+JSON.stringify(L)+'. Antworte NUR mit einem JSON-Array von Strings in gleicher Reihenfolge.',{modelTier:'quick'});
if(many){const m=new Map(L.map((x,i)=>[x,o[i]]));q.value=q.value.split('\n').map(x=>m.has(x)?x+';'+m.get(x):x).join('\n')}else a.value=o[0];vib(15)}catch(x){toast('KI gerade nicht verfügbar')}b.disabled=0;b.textContent='✦ Mit KI schreiben'}}
function ask(t,fn){const m=document.createElement('div');m.className='modal';m.style.zIndex=11;m.innerHTML=`<div class=sheet><h3>${e(t)}</h3><p class=mut>Das lässt sich nicht rückgängig machen.</p><div class=acts><button class=btn id=ax>Abbrechen</button><button class="btn dng" id=ay>Löschen</button></div></div>`;document.body.append(m);m.querySelector('#ax').onclick=()=>m.remove();m.querySelector('#ay').onclick=()=>{m.remove();fn()}}
/* Erinnerung */
const thm=()=>S.set.theme||'dark',fcol=()=>TH[thm()].f||DEF;
function remind(){if(!ses&&S.set.name&&examCheck())return;const n=new Date(),t=day(n);if(ses||!S.set.name||!S.set.remOn||S.remDay===t||todayN()>0)return;const [h,m]=S.set.rem.split(':');if(n.getHours()*60+n.getMinutes()<+h*60+ +m)return;const k=dueList('all').length;if(!k)return;S.remDay=t;save();
const msg=`Lust auf eine kurze Runde? ${Math.min(k,5)} Karten reichen für heute.`,b=document.createElement('div');b.className='ban';b.innerHTML=`<b>Alpha Cards</b><div style="display:block;margin:4px 0 0;color:var(--mu)">${msg}</div><div><button class="btn sm" id=bl>Später</button><button class="btn sm pri" id=bg>Los</button></div>`;document.body.append(b);b.querySelector('#bl').onclick=()=>b.remove();b.querySelector('#bg').onclick=()=>{b.remove();start('all')};
if(window.Notification&&Notification.permission==='granted')try{new Notification('Alpha Cards',{body:msg})}catch(x){}}
load();DEF=S.set.ac||DEF;document.documentElement.dataset.t=thm();ob.ac=DEF;ob.name=S.set.name||'';render();setTimeout(remind,1200);setInterval(remind,6e4);
</script></body></html>
