plugins { id 'com.android.application' }

android {
    namespace 'de.alphacards.app'
    compileSdk 34
    defaultConfig {
        applicationId 'de.alphacards.app'
        minSdk 26
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName = '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: '../alphacards.p12')
            storePassword System.getenv('KS_PASS')
            keyAlias 'alphacards'
            keyPassword System.getenv('KS_PASS')
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
